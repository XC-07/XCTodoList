<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办清单 · 谷歌账号授权回调</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1f1f1f; }
  h2 { margin-bottom: 8px; }
  .card { border: 1px solid #e3e5e8; border-radius: 12px; padding: 20px; margin-top: 16px; }
  .hidden { display: none; }
  code { display: block; word-break: break-all; background: #f6f7f8; border-radius: 8px; padding: 12px; margin: 12px 0; font-size: 13px; }
  button { padding: 10px 18px; border-radius: 8px; border: 1px solid #d0d3d8; background: #fff; cursor: pointer; font-size: 14px; margin-right: 8px; }
  button.primary { background: #4285f4; border-color: #4285f4; color: #fff; }
  .hint { color: #666; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<h2>谷歌账号授权</h2>
<p class="hint" id="status">正在跳回"待办清单"…</p>
<div class="card hidden" id="manual">
  <p>如果应用没有自动打开，请复制下方授权码，回到应用粘贴：</p>
  <code id="codeBox"></code>
  <button class="primary" id="copyBtn" type="button">复制授权码</button>
  <button id="retryBtn" type="button">重试跳回应用</button>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var code = p.get("code") || "";
  var state = p.get("state") || "";
  var err = p.get("error") || "";
  var manual = document.getElementById("manual");
  var statusEl = document.getElementById("status");
  var deep = "todolist://g-callback?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
  function showManual(msg) {
    statusEl.textContent = msg;
    manual.classList.remove("hidden");
    document.getElementById("codeBox").textContent = err ? ("授权失败：" + err) : code;
  }
  document.getElementById("copyBtn").addEventListener("click", function () {
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById("copyBtn").textContent = "已复制";
    });
  });
  document.getElementById("retryBtn").addEventListener("click", function () { location.href = deep; });
  if (err) { showManual("授权失败：" + err); return; }
  if (!code) { showManual("未获取到授权码。"); return; }
  // 首选深链自动跳回应用；1.2 秒后仍未离开页面则展示手动复制兜底
  setTimeout(function () {
    showManual("应用没有自动打开。请复制授权码回到应用粘贴。");
  }, 1200);
  location.href = deep;
})();
</script>
</body>
</html>
